name: Quality and browser tests
on:
  push:
    branches: [main, ui-a11y, ui-a11y-dast]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type:check
      - run: npm run lint
      - run: npm run guidelines:check
      - run: npm run test:unit
      - run: npm run format:check
      - run: npm run ai:skills:check

  # Resolve the exact @playwright/test version from the lockfile so the container image tag
  # below always matches the installed version (Dependabot bumps included). No npm install needed.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: >-
          node -p "'version=' + require('./package-lock.json').packages['node_modules/@playwright/test'].version"
          >> "$GITHUB_OUTPUT"

  # Runs in the official Playwright image (browsers and system deps preinstalled): the apt-based
  # `playwright install --with-deps` step on the bare runner failed on mirror DNS errors.
  test:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    env:
      HOME: /root # needed by Firefox in this image on GitHub Actions
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

name: Quality and browser tests
on:
  push:
    branches: [main, ui-a11y, ui-a11y-dast]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type:check
      - run: npm run lint
      - run: npm run guidelines:check
      - run: npm run test:unit
      - run: npm run format:check
      - run: npm run ai:skills:check
      - run: npm run playwright:image:check

  # Runs in the official Playwright image (browsers and system deps preinstalled): the apt-based
  # `playwright install --with-deps` step on the bare runner failed on mirror DNS errors.
  # The tag is pinned on purpose and must equal the @playwright/test version in package.json
  # (enforced by `npm run playwright:image:check`). Test a new version first, then bump both in one PR.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      # Run as the runner's user, as the Playwright docs recommend: Firefox refuses to start as root
      # with the HOME GitHub sets, and overriding HOME made the docker client warn on every step.
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
